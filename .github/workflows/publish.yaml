name: Build NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.8.1-alpha). Leave empty to use the latest v* tag.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0'

    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          # Triggered by tag push - strip leading 'v'
          VERSION="${GITHUB_REF_NAME#v}"
        elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
          # Manual dispatch with explicit tag
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
        else
          # Manual dispatch with no tag - find latest v* tag
          VERSION=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$VERSION" ]]; then
            echo "::error::No v* tags found in repository"
            exit 1
          fi
          VERSION="${VERSION#v}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
      shell: bash

    - name: Restore dependencies
      run: dotnet restore src/GrindCore.net.csproj

    - name: Build
      run: dotnet build src/GrindCore.net.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

    - name: Pack NuGet package
      run: dotnet pack src/GrindCore.net.csproj --configuration Release --output ./.nuget --no-build -p:Version=${{ steps.version.outputs.version }}

    - name: List .nuget directory contents
      run: ls -la ./.nuget

    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: ./.nuget/*.nupkg

name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string
      upload_to_nuget:
        description: 'Upload to NuGet (uncheck to only upload artifact)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0'

    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          # Strip leading 'v' from tag name (v1.0.0 -> 1.0.0, v1.0.0-beta1 -> 1.0.0-beta1)
          VERSION="${GITHUB_REF_NAME#v}"
        else
          # Manual dispatch fallback - use csproj version + run number as prerelease
          VERSION="0.8.0-ci.${{ github.run_number }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
      shell: bash

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

    - name: Pack NuGet package
      run: dotnet pack --configuration Release --output ./.nuget --no-restore -p:Version=${{ steps.version.outputs.version }}

    - name: List .nuget directory contents
      run: ls -l ${{ github.workspace }}/.nuget

    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: '**/*.nupkg'

    - name: Publish NuGet package
      if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_nuget == 'true' }}
      run: dotnet nuget push ./.nuget/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
